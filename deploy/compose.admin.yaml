# Optional management secrets. Use together with compose.yaml after provisioning.
services:
  api:
    environment:
      ELS_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      ELS_CONFIG_ENCRYPTION_KEY_FILE: /run/secrets/config_encryption_key
      DIVERA_API_KEY: ${DIVERA_API_KEY:-}
    secrets:
      - admin_password_hash
      - config_encryption_key

secrets:
  admin_password_hash:
    file: ./secrets/admin_password_hash
  config_encryption_key:
    file: ./secrets/config_encryption_key
