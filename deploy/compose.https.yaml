# Optional LAN HTTPS ingress. Provision a trusted local-CA certificate with the
# actual LAN hostname/IP in SAN before starting. No Internet access is required.
services:
  web:
    ports:
      - "${ELS_HTTPS_BIND:-0.0.0.0}:${ELS_HTTPS_PORT:-443}:443"
    volumes:
      - ../frontend/deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/run/tls:ro
  api:
    environment:
      CORS_ORIGINS: ${ELS_HTTPS_ORIGIN:?Set the exact trusted HTTPS origin}
