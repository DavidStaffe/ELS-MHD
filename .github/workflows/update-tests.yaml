name: Update management contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt -r backend/tests/requirements-offline.txt
      - run: python -m pytest backend/tests/test_identity_install.py backend/tests/test_identity_access.py backend/tests/test_update_agent.py backend/tests/test_update_bootstrap.py backend/tests/test_system_updates.py backend/tests/test_divera_global_settings.py backend/tests/test_dispatch_geometry_unit.py -q
        env:
          PYTHONPATH: backend
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm test -- --watch=false --runInBand --testPathPattern='(RoleContext|SystemUpdatesPage|EinstellungenPage).test'
        working-directory: frontend
        env:
          CI: 'true'
      - run: npm run build
        working-directory: frontend
        env:
          CI: 'true'
