name: Validate DIVERA and patient changes
on:
  pull_request:
  push:
    branches:
      - feature/divera-patienten-disposition-20261027

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python backend
        run: python -m compileall -q backend
      - name: Test dispatch geometry
        run: python -m unittest discover -s backend/tests -p test_dispatch_geometry_unit.py -v
      - name: Install patient protocol unit-test dependencies
        run: python -m pip install -q "fastapi>=0.115" "pydantic>=2.6" "motor>=3.7" "python-dotenv>=1" "argon2-cffi>=23" "pytest>=8"
      - name: Test patient protocol validation
        working-directory: backend
        run: python -m pytest -q tests/test_patient_protocol_validation.py
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run build
